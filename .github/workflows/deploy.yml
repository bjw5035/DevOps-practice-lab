name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout family-photo-service
        uses: actions/checkout@v4
        with:
          repository: bjw5035/family-photo-service
          path: family-photo-service

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./family-photo-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-practice-lab:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd ~/projects/DevOps-practice-lab &&
            git pull &&
            kubectl apply -f kubernetes/family-photo-service.yaml &&
            kubectl rollout restart deployment/family-photo-service
